services:
  mysql:
    image: mysql:8.0
    container_name: reachflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: reachflow
      MYSQL_USER: reachflow
      MYSQL_PASSWORD: reachflowpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
